<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Maxisacos</title>

    <link rel="stylesheet" href="style.css">

    <!-- Librería para leer códigos QR -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>

    <!-- Nuestro JavaScript -->
    <script src="scripts.js?=v1" defer></script>

</head>

<body>

    <main class="contenedor">

        <header class="encabezado">

            <h1>CONTROL DE MAXISACOS</h1>

            <p class="subtitulo">
                Escanee un código QR o ingrese el ID manualmente.
            </p>

        </header>
        
        <section class="panel">

            <label for="idMaxisaco">
                ID del Maxisaco
            </label>
            
            <input
                type="text"
                id="idMaxisaco"
            
              placeholder="Ejemplo: MS01"
                autocomplete="off">
            
<!--
            <div class="botones">

                <button id="btnRegistrar">
                    Registrar
                </button>
-->
                <button id="btnEscanear">
                    📷 Escanear QR
                    
                </button>

            </div>

        </section>

        <section class="scanner">

            <div id="contenedorScanner"></div>

            <button id="btnFlash" class="btn-flash">
    🔦
</button>

        </section>

        <section class="estado">

            <div id="mensajeEstado"></div>

        </section>

        <!-- =================================================
     MODAL — MAXISACO AGOTADO
================================================= -->

<div id="modalMaxisaco" class="modal">

    <div class="modal-contenido">

        <h2>⚠️ Maxisaco agotado</h2>

        <p id="mensajeModalMaxisaco"></p>

        <p>
            ¿Qué desea hacer?
        </p>

        <div class="modal-botones">

            <button id="btnEnviarObsoleto">
                Enviar de todas formas
            </button>

            <button id="btnContinuarEscaneo">
                Continuar con el escaneo
            </button>

        </div>

    </div>

</div>

        

    </main>

</body>

</html>
